worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # Uploads can be large (up to the platform file-size limit). Allow big bodies.
    client_max_body_size 5g;

    upstream nestjs_template {
        server web:8000;
    }

    server {
        listen 80;
        server_name _;

        # Static assets are collected to /app/staticfiles and shared via volume.
        location /static/ {
            alias /app/staticfiles/;
            access_log off;
            expires 30d;
        }

        location /health/ {
            proxy_pass http://nestjs_template;
            access_log off;
        }

        location / {
            proxy_pass http://nestjs_template;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;
        }
    }
}
